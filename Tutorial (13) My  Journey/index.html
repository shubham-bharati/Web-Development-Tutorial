<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        nav {
            padding: 20px;
            background: #1f2937;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .hero span {
            color: #38bdf8;
        }

        .hero p {
            color: #cbd5e1;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #111827;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <div class="hero">
        <h1>Hello, I'm <span>Shubham</span> 👋</h1>

        <p>Web Development Learner | HTML • CSS • JavaScript</p>

        <button onclick="showMessage()">Explore My Journey</button>
    </div>

    <script>
        function showMessage() {
            alert("Welcome to my Web Development Journey 🚀");
        }
    </script>

</body>
</html>
