<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Container</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            padding: 30px;
            background: white;
            border: 3px solid #2563eb;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2563eb;
        }

        .boxes {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .box {
            flex: 1;
            padding: 30px 20px;
            text-align: center;
            background: #dbeafe;
            border: 2px solid #3b82f6;
            border-radius: 15px;
            transition: 0.3s;
        }

        .box:hover {
            transform: translateY(-8px);
            background: #bfdbfe;
        }

        .box h2 {
            margin-bottom: 10px;
            color: #1d4ed8;
        }

        .box p {
            color: #334155;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .boxes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Container</h1>

        <div class="boxes">

            <div class="box">
                <h2>HTML</h2>
                <p>HTML is used to create the structure of a webpage.</p>
            </div>

            <div class="box">
                <h2>CSS</h2>
                <p>CSS is used to design and style the webpage.</p>
            </div>

            <div class="box">
                <h2>JavaScript</h2>
                <p>JavaScript is used to add functionality and interaction.</p>
            </div>

        </div>

    </div>

</body>
</html>
