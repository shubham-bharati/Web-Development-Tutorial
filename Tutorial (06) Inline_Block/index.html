<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Element- HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p> Hey I am Shubham </p> <!-- p is a block element -->
    <a href="https://google.com">Google</a> <!-- a is an inline element -->
    <div> I am a block element</div>
    <span> I am span and I am inline </span>
    <a href="https://amazon.com">Amazon</a>
</body>
</html>
